name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy Api Preview to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.TURBO_TOKEN }}
          github-token: ${{ secrets.PAT_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy Web Preview to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.TURBO_TOKEN }}
          github-token: ${{ secrets.PAT_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
