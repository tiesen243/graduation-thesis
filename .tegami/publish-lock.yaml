core:changelogs:
  - content: "---\npackages:\n  npm:@rozumari/api:\n    type: patch\n  npm:@rozumari/contract:\n    type: patch\n  npm:@rozumari/web:\n    type: patch\n---\n\n## Complete Auth features & UI\n\n- **Authentication Core (`@rozumari/api`):**\n  - Implemented core auth flow endpoints: `login`, `register`, `refresh`, and `whoami`.\n  - Added OAuth support with **Google Sign-In**.\n\n- **User Interface (`@rozumari/web`):**\n  - Added interactive UI forms for **Login** and **Registration**.\n  - Integrated Google OAuth login button into the auth UI.\n  - Added auto token refresh mechanism on **401 Unauthorized** errors.\n"
    filename: 2026-08-06-mshg901y.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@rozumari/web:\n    type: patch\n  npm:@rozumari/ui:\n    type: patch\n---\n\n## Initialized Web Application Architecture\n\n- **Web App Structure:** Initialized core architecture powered by **React Router v8**, **Tailwind CSS**, and **shadcn/ui**.\n- **Monorepo Integration:** Established cross-package linkages across:\n  - `@rozumari/web`: Main web application routes and setup.\n  - `@rozumari/ui`: Shared component layer with Tailwind and shadcn styling.\n"
    filename: 2026-08-03-msc6jqa7.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@rozumari/api:\n    type: patch\n---\n\n## Core Authentication & Authorization System\n\n- Added `login`, `register`, and `whoami` API endpoints.\n- Introduced `authMiddleware` to secure protected routes and handle user sessions.\n"
    filename: 2026-08-02-msbniubv.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@rozumari/api:\n    type: patch\n---\n\n## OAuth 2.0 Integration with Google\n\n- Added Google OAuth 2.0 authentication endpoints (`redirect` and `callback`).\n- Integrated secure PKCE/State validation using HttpOnly cookies with CSRF protection.\n- Handled dynamic user provisioning and automated Google account linking.\n"
    filename: 2026-08-02-msbw2hjg.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@rozumari/ui:\n    type: patch\n---\n\n### Introduced initial suite of 20 core UI components for `@rozumari/ui`:\n\n- **Form Controls:** `Button`, `Checkbox`, `Field`, `Input`, `Label`, `RadioGroup`, `Select`, `Switch`\n- **Overlays & Feedback:** `AlertDialog`, `Dialog`, `DropdownMenu`, `Sheet`, `Toast`, `Tooltip`\n- **Navigation & Layout:** `Card`, `Separator`, `Sidebar`, `Tabs`\n- **Data Display:** `Avatar`, `Skeleton`, `Table`, `Typography`\n"
    filename: 2026-08-03-msc2u0z1.md
    v: 0.0.0
